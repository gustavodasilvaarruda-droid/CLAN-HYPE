<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="hype-home"><main class="dashboard-shell"><div class="page-topline"><a class="smart-back" href="{{url_for('painel')}}">← Painel</a><span>Administração › Configurações</span></div>{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<section class="dash-welcome"><div><span class="breed-kicker">CONFIGURAÇÕES GERAIS</span><h1>HYPE</h1><p>Identidade, Discord e transmissão oficial pelo YouTube.</p></div></section><form method="post" class="dash-card admin-form-grid"><label>Nome do clã<input name="nome_clan" value="{{cfg.get('nome_clan','HYPE')}}"></label><label>Convite do Discord<input name="discord_url" value="{{cfg.get('discord_url','')}}"></label><label class="wide">Webhook do Discord<input name="discord_webhook_url" value="{{cfg.get('discord_webhook_url','')}}"><small>Fica armazenado no servidor; não exponha em páginas públicas.</small></label><div class="wide config-divider"><span class="breed-kicker">HYPE LIVE</span><h2>OBS → YouTube → Site</h2></div><label>Título da transmissão<input name="youtube_live_titulo" value="{{cfg.get('youtube_live_titulo','HYPE Live')}}"></label><label>URL do vídeo/live no YouTube<input name="youtube_live_url" value="{{cfg.get('youtube_live_url','')}}" placeholder="https://youtube.com/watch?v=..."></label><label class="check-line wide"><input type="checkbox" name="youtube_live_ativo" {% if cfg.get('youtube_live_ativo','')|lower in ['true','1','on','sim'] %}checked{% endif %}> Mostrar HYPE Live no site</label><button class="cta-gold">Salvar configurações</button></form></main></body></html>
