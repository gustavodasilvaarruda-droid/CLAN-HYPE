<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Temporadas</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><a href="{{url_for('painel')}}">← Painel</a><h1>Temporadas</h1><form method="post" class="card"><input name="nome" placeholder="Nome da temporada" required><input type="date" name="inicio"><input type="date" name="fim"><label><input type="checkbox" name="ativa"> Tornar ativa</label><button>Criar temporada</button></form>{% for t in temporadas %}<article class="card"><b>{{t.nome}}</b> {{'• ATIVA' if t.ativa else ''}}<form method="post" action="{{url_for('final.ativar_temporada',tid=t.id)}}"><button>Ativar</button></form></article>{% endfor %}<h2>Pontuação manual</h2><form method="post" action="{{url_for('final.pontuar')}}" class="card"><input name="temporada_id" type="number" placeholder="ID temporada" required><input name="email" type="email" placeholder="E-mail do membro" required><input name="pontos" type="number" placeholder="Pontos"><input name="vitorias" type="number" placeholder="Vitórias"><input name="podios" type="number" placeholder="Pódios"><button>Adicionar</button></form></main></body></html>
