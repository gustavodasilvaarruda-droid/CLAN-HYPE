<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Competitivo</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><a href="{{url_for('final.temporadas')}}">← Temporadas</a><h1>Ranking competitivo</h1><table><thead><tr><th>#</th><th>Membro</th><th>Pontos</th><th>Vitórias</th><th>Pódios</th></tr></thead><tbody>{% for r in ranking %}<tr><td>{{loop.index}}</td><td>{{r.usuario_email}}</td><td>{{r.pontos}}</td><td>{{r.vitorias}}</td><td>{{r.podios}}</td></tr>{% else %}<tr><td colspan="5">Sem pontuação.</td></tr>{% endfor %}</tbody></table></main></body></html>
