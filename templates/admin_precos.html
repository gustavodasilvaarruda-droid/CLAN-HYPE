<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Preços Breed</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="hype-home"><main class="content-hub"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><div class="section-heading"><span>ADMIN</span><h1>Preços do Berçário</h1></div><div class="admin-editor">{% for p in precos %}<form class="price-row" method="post"><span><b>{{p.nome}}</b><small>{{p.codigo}}</small></span><input type="hidden" name="codigo" value="{{p.codigo}}"><input type="number" min="0" name="valor" value="{{p.valor}}"><button class="cta-gold">Salvar</button></form>{% endfor %}</div></main></body></html>
