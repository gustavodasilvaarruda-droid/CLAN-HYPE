<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário HYPE</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a href="{{url_for('pagina_inicial')}}">HYPE</a><nav><a href="{{url_for('eventos')}}">Eventos</a><a href="{{url_for('torneios')}}">Torneios</a><a href="{{url_for('painel')}}">Painel</a></nav></header><main class="container"><h1>Calendário HYPE</h1><div class="grid-cards">{% for x in itens %}<article class="card"><span class="badge">{{x.tipo}}</span><h3>{{x.titulo}}</h3><p>{{x.data_evento or x.data_torneio or x.data_hora or 'Data a definir'}}</p><p>{{x.local or x.servidor or ''}}</p></article>{% else %}<p>Nenhuma atividade agendada.</p>{% endfor %}</div></main></body></html>
