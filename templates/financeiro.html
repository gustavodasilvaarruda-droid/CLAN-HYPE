<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro Breed</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><a href="{{url_for('painel')}}">← Painel</a><h1>Financeiro do Berçário</h1><article class="card"><h2>{{total|int}}</h2><p>Total registrado em pedidos entregues</p></article><table><thead><tr><th>Breeder</th><th>Valor gerado</th></tr></thead><tbody>{% for email,valor in por_breeder %}<tr><td>{{email}}</td><td>{{valor|int}}</td></tr>{% endfor %}</tbody></table><p>Os dados são calculados a partir dos pedidos entregues e preservam o histórico do banco.</p></main></body></html>
