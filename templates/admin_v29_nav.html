<script>(()=>{document.querySelectorAll('.admin-v29-nav:not([data-mobile-ready])').forEach(nav=>{const btn=nav.querySelector('.admin-v29-mobile-toggle');if(!btn)return;nav.dataset.mobileReady='1';function set(open){nav.classList.toggle('is-open',open);btn.setAttribute('aria-expanded',String(open));}btn.addEventListener('click',()=>set(!nav.classList.contains('is-open')));nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>set(false)));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nav.classList.contains('is-open')){set(false);btn.focus()}});window.addEventListener('resize',()=>{if(window.innerWidth>900)set(false)});});})();</script>
