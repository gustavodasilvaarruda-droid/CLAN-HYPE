<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Atividades - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="hype-home"><main class="dashboard-shell"><div class="page-topline"><a class="smart-back" href="{{url_for('painel')}}">← Administração</a><span>Central de Atividades</span></div><section class="dash-card"><span class="breed-kicker">AUDITORIA DO REINO</span><h1>Central de Atividades</h1>{% for x in atividades %}<div class="activity-row"><b>{{x.tipo}}</b><span>{{x.descricao}}</span><small>{{x.ator_email or 'sistema'}} • {{x.created_at}}</small></div>{% else %}<p class="muted">Sem atividades.</p>{% endfor %}</section></main></body></html>
