<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Funções - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="page-shell"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><section class="dash-card"><h1>⚙️ Funções secundárias</h1><p>Um membro pode acumular funções, como Breeder + Builder, sem trocar o cargo principal.</p><form method="post" class="profile-edit"><select name="usuario_email">{% for u in usuarios %}<option value="{{u.email}}">{{u.nick_jogo}} — {{u.cargo}}</option>{% endfor %}</select><select name="funcao"><option value="breeder">Breeder</option><option value="builder">Builder</option><option value="organizador_eventos">Organizador de eventos</option><option value="organizador_torneios">Organizador de torneios</option></select><select name="acao"><option value="adicionar">Adicionar</option><option value="remover">Remover</option></select><button class="cta-gold">Aplicar</button></form></section><section class="dash-card"><h2>Atuais</h2>{% for f in funcoes %}<p>{{f.usuario_email}} — <b>{{f.funcao}}</b></p>{% endfor %}</section></main></body></html>
