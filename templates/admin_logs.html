<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logs - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="page-shell"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><section class="dash-card"><h1>🧾 Log administrativo</h1><div class="table-wrap"><table><tr><th>Data</th><th>Usuário</th><th>Módulo</th><th>Ação</th><th>Alvo</th></tr>{% for l in logs %}<tr><td>{{l.created_at|replace('T',' ')}}</td><td>{{l.usuario_email or 'sistema'}}</td><td>{{l.modulo}}</td><td>{{l.acao}}</td><td>{{l.alvo_tipo or ''}} {{l.alvo_id or ''}}</td></tr>{% else %}<tr><td colspan="5">Sem logs.</td></tr>{% endfor %}</table></div></section></main></body></html>
