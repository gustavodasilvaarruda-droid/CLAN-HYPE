<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Builds Pokémon</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><a href="{{url_for('painel')}}">← Painel</a><h1>Builds Pokémon</h1><form method="post" class="card"><input name="pokemon" placeholder="Pokémon" required><input name="titulo" placeholder="Título da Build" required><input name="nature" placeholder="Nature"><input name="ability" placeholder="Ability"><input name="evs" placeholder="EVs: 252 Atk / 252 Spe..."><input name="ivs" placeholder="IVs"><textarea name="moves" placeholder="Golpes / Moves"></textarea><input name="item" placeholder="Item"><textarea name="estrategia" placeholder="Explicação e estratégia"></textarea><button>Publicar Build</button></form><div class="grid-cards">{% for b in builds %}<article class="card"><h2>{{b.pokemon}} — {{b.titulo}}</h2><p><b>Nature:</b> {{b.nature or '-'}} | <b>Ability:</b> {{b.ability or '-'}}</p><p><b>EVs:</b> {{b.evs or '-'}}<br><b>IVs:</b> {{b.ivs or '-'}}<br><b>Item:</b> {{b.item or '-'}}</p><p><b>Moves:</b><br>{{b.moves or '-'}}</p><p>{{b.estrategia or ''}}</p></article>{% endfor %}</div></main></body></html>
