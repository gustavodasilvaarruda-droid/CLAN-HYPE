<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporadas HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><a href="{{url_for('pagina_inicial')}}">← HYPE</a><h1>Temporadas</h1>{% for t in temporadas %}<article class="card"><h3>{{t.nome}} {% if t.ativa %}<span class="badge">ATUAL</span>{% endif %}</h3><p>{{t.inicio or '?'}} — {{t.fim or '?'}}</p><a href="{{url_for('final.ranking_competitivo',temporada_id=t.id)}}">Ver ranking</a></article>{% else %}<p>Nenhuma temporada criada.</p>{% endfor %}</main></body></html>
