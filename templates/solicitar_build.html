<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Solicitar Build - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="hype-home"><main class="content-hub"><a class="text-link" href="{{url_for('builds')}}">← Builds</a><div class="section-heading"><span>HYPE BUILDS</span><h1>Solicitar uma Build</h1></div><section class="admin-editor"><form class="content-form" method="post"><input name="pokemon" required placeholder="Pokémon"><input name="objetivo" required placeholder="Objetivo: PvP, torneio, história..."><textarea name="observacoes" placeholder="Observações"></textarea><button class="cta-gold">Enviar pedido</button></form></section><section class="dash-card"><h2>Meus pedidos</h2>{% for p in pedidos %}<div class="builder-request"><b>#{{p.id}} {{p.pokemon}}</b><span>{{p.status}}</span><a class="cta-dark" href="{{url_for('chat_pedido',tipo='build',pedido_id=p.id)}}">💬 Chat</a>{% if p.status in ['pendente','em_andamento'] %}<form method="post" action="{{url_for('cancelar_build',pedido_id=p.id)}}"><input name="motivo" placeholder="Motivo"><button class="cta-dark">Cancelar</button></form>{% endif %}{% if p.status in ['concluido','entregue'] %}<form class="rating-form" method="post" action="{{url_for('avaliar_pedido',tipo='build',pedido_id=p.id)}}"><select name="nota"><option value="5">5 ⭐</option><option value="4">4 ⭐</option><option value="3">3 ⭐</option><option value="2">2 ⭐</option><option value="1">1 ⭐</option></select><input name="comentario" placeholder="Comentário"><button class="cta-gold">Avaliar</button></form>{% endif %}</div>{% else %}<p class="muted">Nenhum pedido.</p>{% endfor %}</section></main></body></html>
