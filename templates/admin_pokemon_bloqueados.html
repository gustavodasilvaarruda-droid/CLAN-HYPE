<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Bloqueios Breed - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="page-shell"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><section class="dash-card"><h1>🚫 Pokémon indisponíveis para Breed</h1><form method="post" class="profile-edit"><input name="pokemon" required placeholder="Nome do Pokémon"><input name="motivo" placeholder="Motivo"><input type="hidden" name="acao" value="adicionar"><button class="cta-gold">Bloquear</button></form>{% for i in itens %}<form method="post" class="dash-row"><span><b>{{i.pokemon}}</b> — {{i.motivo or 'sem motivo'}}</span><input type="hidden" name="pokemon" value="{{i.pokemon}}"><input type="hidden" name="acao" value="remover"><button class="cta-dark">Remover</button></form>{% endfor %}</section></main></body></html>
