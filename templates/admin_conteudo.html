<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Eventos e Torneios</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="hype-home"><main class="content-hub"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><div class="section-heading"><span>ADMIN</span><h1>Eventos e Torneios</h1></div><div class="admin-two-col"><section class="dash-card"><h2>Novo evento</h2><form class="content-form" method="post" action="{{url_for('criar_evento')}}"><input name="titulo" required placeholder="Título"><textarea name="descricao" required placeholder="Descrição"></textarea><input type="datetime-local" name="data_evento" required><input name="local_evento" placeholder="Local"><input name="imagem_url" placeholder="Imagem URL"><input type="number" name="limite_participantes" placeholder="Limite"><label><input type="checkbox" name="publicado" checked> Publicado</label><button class="cta-gold">Criar evento</button></form></section><section class="dash-card"><h2>Novo torneio</h2><form class="content-form" method="post" action="{{url_for('criar_torneio')}}"><input name="titulo" required placeholder="Título"><textarea name="descricao" required placeholder="Descrição"></textarea><input type="datetime-local" name="data_torneio" required><input name="formato" placeholder="Formato"><textarea name="regras" placeholder="Regras"></textarea><input name="premio" placeholder="Prêmio"><input name="imagem_url" placeholder="Imagem URL"><input type="number" name="limite_participantes" placeholder="Limite"><label><input type="checkbox" name="publicado" checked> Publicado</label><button class="cta-gold">Criar torneio</button></form></section></div><section class="dash-card"><h2>Publicados</h2>{% for e in eventos %}<div class="dash-row"><b>📅 {{e.titulo}}</b><span>{{e.total_inscritos}} inscritos</span></div>{% endfor %}{% for t in torneios %}<div class="dash-row"><b>🏆 {{t.titulo}}</b><span>{{t.total_inscritos}} inscritos</span></div>{% endfor %}</section></main></body></html>
