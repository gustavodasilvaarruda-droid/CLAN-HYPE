<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Chat do pedido - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="page-shell"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><section class="dash-card"><h1>💬 Chat {{tipo|title}} #{{pedido.id}}</h1><div class="chat-box">{% for m in mensagens %}<div class="chat-msg {% if m.remetente_email==session.get('usuario_email') %}mine{% endif %}"><b>{{'Você' if m.remetente_email==session.get('usuario_email') else 'Equipe/Membro'}}</b><p>{{m.mensagem}}</p><small>{{m.created_at|replace('T',' ')}}</small></div>{% else %}<p class="muted">Nenhuma mensagem ainda.</p>{% endfor %}</div><form method="post" class="chat-form"><textarea name="mensagem" maxlength="1500" required placeholder="Digite sua mensagem..."></textarea><button class="cta-gold">Enviar</button></form></section></main></body></html>
