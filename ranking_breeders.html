<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ranking de Breeders - HYPE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="page-shell"><a class="text-link" href="{{url_for('painel')}}">← Painel</a><section class="dash-card"><h1>🏅 Ranking mensal de Breeders</h1><form method="get"><input type="month" name="mes" value="{{mes}}"><button class="cta-gold">Ver mês</button></form><div class="table-wrap"><table><thead><tr><th>#</th><th>Breeder</th><th>Breeds</th><th>Valor gerado</th><th>Avaliação</th></tr></thead><tbody>{% for r in ranking %}<tr><td>{{loop.index}}</td><td>{{r.nick}}</td><td>{{r.total}}</td><td>${{'{:,}'.format(r.valor).replace(',','.')}}</td><td>{{r.media if r.media else '—'}}{% if r.media %}/5{% endif %}</td></tr>{% else %}<tr><td colspan="5">Sem resultados neste mês.</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
