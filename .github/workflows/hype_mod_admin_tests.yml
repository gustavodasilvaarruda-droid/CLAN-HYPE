name: HYPE Mods Admin tests

on:
  pull_request:
    paths:
      - "modules/hype_mod_admin.py"
      - "modules/hype_mod_access.py"
      - "tests/test_hype_mod_admin.py"
      - "tests/test_hype_mod_access.py"
      - ".github/workflows/hype_mod_admin_tests.yml"
  push:
    branches:
      - "feature/hype-modulos-admin-20261018"

permissions:
  contents: read

jobs:
  test-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_hype_mod*.py" -v
