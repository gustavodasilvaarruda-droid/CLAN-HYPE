name: HYPE Mods Admin tests

on:
  pull_request:
    paths:
      - "modules/hype_mod_admin.py"
      - "modules/hype_mod_staging.py"
      - "modules/hype_signed_release.py"
      - "modules/hype_updates.py"
      - "sql/20261121_hype_mod_published_releases.sql"
      - "requirements.txt"
      - "app.py"
      - "templates/admin_hype_mod_releases.html"
      - "templates/admin_hype_modulos.html"
      - "tests/test_hype_mod_inspection_route.py"
      - "tests/test_hype_mod_release_validator.py"
      - "tests/test_hype_mod_staging_upload.py"
      - "tests/test_hype_mod_signed_distribution.py"
      - "modules/hype_mod_access.py"
      - "modules/hype_client_api.py"
      - "modules/hype_mod_update_access.py"
      - "modules/hype_mod_authenticated_updates.py"
      - "tests/test_hype_mod_authenticated_updates.py"
      - "tests/test_hype_mod_admin.py"
      - "tests/test_hype_mod_access.py"
      - ".github/workflows/hype_mod_admin_tests.yml"
  push:
    branches:
      - "feature/hype-modulos-admin-20261018"

permissions:
  contents: read

jobs:
  test-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_hype_mod*.py" -v
