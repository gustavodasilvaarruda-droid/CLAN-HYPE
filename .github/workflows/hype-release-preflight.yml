name: HYPE signed release preflight

on:
  push:
    paths:
      - "tools/hype_sign_release.py"
      - "tests/test_hype_sign_release.py"
      - ".github/workflows/hype-release-preflight.yml"
  pull_request:
    paths:
      - "tools/hype_sign_release.py"
      - "tests/test_hype_sign_release.py"
      - ".github/workflows/hype-release-preflight.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local signing-tool test dependency
        run: python -m pip install "cryptography>=43,<47"
      - name: Run pinned-key and manifest tests
        run: python -m unittest discover -s tests -p 'test_hype_sign_release.py' -v
      - name: Check Python compilation
        run: python -m py_compile tools/hype_sign_release.py
