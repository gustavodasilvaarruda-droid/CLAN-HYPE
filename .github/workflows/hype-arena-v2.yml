name: HYPE Arena - torneios v2
on:
  pull_request:
    paths:
      - 'app.py'
      - 'modules/events_v26.py'
      - 'modules/expansion_features.py'
      - 'templates/team_builder.html'
      - 'static/hype_team_builder_modern.css'
      - 'tests/test_hype_team_builder_ui.py'
      - 'tests/test_hype_team_strategy.py'
      - 'modules/hype_team_strategy.py'
      - 'modules/hype_tactical_intelligence.py'
      - 'data/hype_strategy_battle_dex.json'
      - 'tests/test_hype_tactical_intelligence.py'
      - 'templates/team_analise.html'
      - 'static/hype_team_strategy.css'
      - 'modules/hype_tournament_formats.py'
      - 'modules/arena_private_teams.py'
      - 'templates/arena_torneio_equipes.html'
      - 'templates/admin_arena_equipes.html'
      - 'tests/test_hype_arena_admin_review.py'
      - 'supabase/migrations/20261110_arena_aprovacao_inscricoes.sql'
      - 'static/hype_arena_private_teams.css'
      - 'tests/test_hype_arena_private_teams.py'
      - 'supabase/migrations/20261110_arena_3_equipes_privadas.sql'
      - 'templates/admin_conteudo.html'
      - 'static/hype_arena_presets.js'
      - 'static/hype_arena_presets.css'
      - 'templates/torneio_detalhe.html'
      - 'templates/torneios.html'
      - 'static/hype_arena_v2.css'
      - 'tests/test_hype_arena_v2.py'
      - 'tests/test_arena_formatos_fk.py'
      - '.github/workflows/hype-arena-v2.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'modules/events_v26.py'
      - 'modules/expansion_features.py'
      - 'templates/team_builder.html'
      - 'static/hype_team_builder_modern.css'
      - 'tests/test_hype_team_builder_ui.py'
      - 'tests/test_hype_team_strategy.py'
      - 'modules/hype_team_strategy.py'
      - 'modules/hype_tactical_intelligence.py'
      - 'data/hype_strategy_battle_dex.json'
      - 'tests/test_hype_tactical_intelligence.py'
      - 'templates/team_analise.html'
      - 'static/hype_team_strategy.css'
      - 'modules/hype_tournament_formats.py'
      - 'modules/arena_private_teams.py'
      - 'templates/arena_torneio_equipes.html'
      - 'templates/admin_arena_equipes.html'
      - 'tests/test_hype_arena_admin_review.py'
      - 'supabase/migrations/20261110_arena_aprovacao_inscricoes.sql'
      - 'static/hype_arena_private_teams.css'
      - 'tests/test_hype_arena_private_teams.py'
      - 'supabase/migrations/20261110_arena_3_equipes_privadas.sql'
      - 'templates/admin_conteudo.html'
      - 'static/hype_arena_presets.js'
      - 'static/hype_arena_presets.css'
      - 'templates/torneio_detalhe.html'
      - 'templates/torneios.html'
      - 'tests/test_hype_arena_v2.py'
      - 'tests/test_arena_formatos_fk.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jinja2
      - run: python -m py_compile app.py modules/events_v26.py modules/hype_tournament_formats.py modules/arena_private_teams.py modules/expansion_features.py modules/competitive_features.py modules/hype_team_strategy.py modules/hype_tactical_intelligence.py
      - run: python -m unittest discover -s tests -p 'test_hype_arena_v2.py' -v
      - run: python -m unittest discover -s tests -p 'test_hype_arena_private_teams.py' -v
      - run: python -m unittest discover -s tests -p 'test_hype_arena_admin_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_hype_team_builder_ui.py' -v
      - run: python -m unittest discover -s tests -p 'test_hype_team_strategy.py' -v
      - run: python -m unittest discover -s tests -p 'test_hype_tactical_intelligence.py' -v
      - run: python -m unittest discover -s tests -p 'test_arena_formatos_fk.py' -v
