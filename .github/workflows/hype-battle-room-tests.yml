name: HYPE Sala de Batalha — testes
on:
  pull_request:
    paths:
      - 'modules/events_v26.py'
      - 'modules/battle_room_rules.py'
      - 'tests/test_hype_battle_room_*.py'
      - '.github/workflows/hype-battle-room-tests.yml'
  workflow_dispatch:

jobs:
  battle-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Flask
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Testar permissões, presença e confirmação dupla
        run: python -m unittest discover -s tests -p 'test_hype_battle_room_*.py' -v
