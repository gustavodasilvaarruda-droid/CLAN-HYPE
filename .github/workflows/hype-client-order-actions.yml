name: HYPE Client — order actions tests

on:
  pull_request:
    paths:
      - "app.py"
      - "modules/hype_client_api.py"
      - "modules/hype_client_order_details.py"
      - "modules/hype_client_order_actions.py"
      - "tests/test_hype_client_order_actions.py"
      - "tests/test_hype_client_order_details.py"
      - ".github/workflows/hype-client-order-actions.yml"
  push:
    branches:
      - "feature/hype-client-meus-pedidos-acoes-*"

permissions:
  contents: read

jobs:
  verify-order-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Syntax verification
        run: python -m py_compile app.py modules/hype_client_api.py modules/hype_client_order_details.py modules/hype_client_order_actions.py
      - name: Owner-only read details tests
        run: python -m unittest discover -s tests -p 'test_hype_client_order_details.py' -v
      - name: Authenticated actions and status protection tests
        run: python -m unittest discover -s tests -p 'test_hype_client_order_actions.py' -v
