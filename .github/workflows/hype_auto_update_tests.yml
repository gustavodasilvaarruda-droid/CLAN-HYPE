name: HYPE Auto Update API tests
on:
  pull_request:
    paths:
      - 'modules/hype_updates.py'
      - 'tests/test_hype_updates.py'
      - '.github/workflows/hype_auto_update_tests.yml'
  push:
    branches:
      - main
    paths:
      - 'modules/hype_updates.py'
      - 'tests/test_hype_updates.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3,<4'
      - run: python -m unittest discover -s tests -p test_hype_updates.py -v
