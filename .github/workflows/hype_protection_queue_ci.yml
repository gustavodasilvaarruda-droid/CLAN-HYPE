name: HYPE protection queue offline tests

on:
  pull_request:
    paths:
      - "sql/20261123_hype_mod_protection_queue.sql"
      - "sql/20261125_hype_mod_claim_valid_drafts.sql"
      - "tests/test_hype_claim_selection_offline.py"
      - "modules/hype_mod_staging.py"
      - "templates/admin_hype_mod_releases.html"
      - "tests/test_hype_mod_private_cleanup.py"
      - "tests/test_hype_publish_center_ui.py"
      - ".github/workflows/hype_protection_queue_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run isolated queue tests without external services
        run: python3 -m unittest discover -s tests -p 'test_hype_claim_selection_offline.py' -v

  private-cleanup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install private-cleanup test dependencies
        run: python3 -m pip install "Flask>=3.0,<4" "cryptography>=46.0.4,<47"
      - name: Test owner-only private JAR cleanup
        run: python3 -m unittest discover -s tests -p 'test_hype_mod_private_cleanup.py' -v
